worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_shutdown_timeout 20s;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Exclude URL, query, IP, cookies, referer and body: portal data must not enter logs.
  log_format operational escape=json '{"time":"$time_iso8601","request_id":"$request_id","status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time}';
  access_log /dev/stdout operational;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  sendfile on;
  server_tokens off;
  keepalive_timeout 15s;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 15s;
  client_max_body_size 1k;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Current portal uses inline style attributes and blob viewers. Enforce CSP only
    # after browser acceptance verifies all flows; this policy is report-only.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; frame-src blob:; object-src blob:; base-uri 'self'; frame-ancestors 'none'" always;
    # Filenames are not fingerprinted. Never use immutable or year-long cache TTLs.
    add_header Cache-Control "no-cache" always;
    location = /healthz { access_log off; try_files $uri =503; }
    location / { limit_except GET { deny all; } try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
  }
}
