apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eduwave-web
spec:
  podSelector:
    matchLabels: {app: eduwave-web}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        # Set this namespace label on the chosen ingress-controller namespace.
        - namespaceSelector:
            matchLabels: {eduwave-ingress: "true"}
      ports: [{protocol: TCP, port: 8080}]
  egress: []
